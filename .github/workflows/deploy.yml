# .github/workflows/deploy.yml
# Auto-deploy ke Contabo VPS setiap push ke `main`.
#
# Setup GitHub Secrets (Repo → Settings → Secrets and variables → Actions):
#   SSH_HOST          → hunter.elexart.com (atau IP VPS)
#   SSH_USER          → deploy
#   SSH_PORT          → 22
#   SSH_PRIVATE_KEY   → isi file private key (cat ~/.ssh/id_ed25519)
#   DEPLOY_PATH       → /var/www/hunter.elexart.com
#   REACT_APP_BACKEND_URL → https://hunter.elexart.com
#   SUPERVISOR_BACKEND    → hunter-backend (nama program di supervisor)

name: Deploy to Contabo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Build frontend (production)
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync frontend build to server
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            frontend/build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/frontend/build/

      - name: Deploy backend (git pull + pip + restart)
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash <<EOF
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch --all
            git reset --hard origin/main
            cd backend
            [ -d venv ] || python3 -m venv venv
            source venv/bin/activate
            pip install -q --upgrade pip
            pip install -q -r requirements.txt
            deactivate
            sudo supervisorctl restart ${{ secrets.SUPERVISOR_BACKEND }}
            sudo systemctl reload nginx
            echo "Deploy selesai pada \$(date)"
          EOF

      - name: Health check
        run: |
          sleep 5
          URL="${{ secrets.REACT_APP_BACKEND_URL }}"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          API=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/")
          echo "Web: $HTTP | API: $API"
          [[ "$HTTP" =~ ^(200|301|302)$ ]] || exit 1
          [[ "$API" =~ ^(200|301|302)$ ]] || exit 1
