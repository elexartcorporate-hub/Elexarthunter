# Supervisor config untuk WA Service (Baileys sidecar) — install di VPS:
#
#   sudo cp etc/supervisor.wa-service.conf /etc/supervisor/conf.d/hunter-wa-service.conf
#   sudo supervisorctl reread && sudo supervisorctl update
#   sudo supervisorctl status hunter-wa-service
#
# Pastikan ganti `/var/www/hunter.elexart.com` ke path actual VPS Anda dan
# ganti WA_SERVICE_SECRET ke value yang sama di backend/.env.
#
[program:hunter-wa-service]
command=/usr/bin/node /var/www/hunter.elexart.com/wa-service/src/index.js
directory=/var/www/hunter.elexart.com/wa-service
user=deploy
autostart=true
autorestart=true
environment=NODE_ENV="production",MONGO_URL="mongodb://localhost:27017",DB_NAME="lead_hunter_db",WA_SERVICE_PORT="3002",WA_SERVICE_SECRET="REPLACE-WITH-STRONG-SECRET-MATCH-BACKEND-ENV"
stderr_logfile=/var/log/supervisor/hunter-wa-service.err.log
stdout_logfile=/var/log/supervisor/hunter-wa-service.out.log
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
